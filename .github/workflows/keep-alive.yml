name: Keep Supabase Alive

on:
  schedule:
    # Runs every 3 days at 8:00 AM UTC
    - cron: "0 8 */3 * *"
  workflow_dispatch: # Allows you to run it manually for testing

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Ping Supabase REST API
        run: |
          curl -s "${{ secrets.https://tfradfxljdfcjenpuoxt.supabase.co }}/rest/v1/" \
            -H "apikey: ${{ secrets.sb_publishable_z4Wy19-QK_0YKtsJtEhkHA_US4PL8TM }}" \
            -H "Authorization: Bearer ${{ secrets.sb_publishable_z4Wy19-QK_0YKtsJtEhkHA_US4PL8TM }}"
