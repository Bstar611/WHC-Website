<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Reset Password - Wonderhills College</title>
    <link rel="stylesheet" href="css/style.css" />
    <link rel="icon" href="/images/favicon.png" type="image/png">
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <style>
        .password-wrapper {
            position: relative;
        }
        .password-wrapper input {
            padding-right: 40px;
            width: 100%;
        }
        .toggle-password {
            position: absolute;
            right: 12px;
            top: 50%;
            transform: translateY(-50%);
            background: none;
            border: none;
            cursor: pointer;
            font-size: 1.2rem;
            color: #6b3a2a;
            padding: 0;
        }
        .toggle-password:hover {
            color: #4a2c1a;
        }
    </style>
</head>
<body>
    <header>
        <div class="container">
            <div class="logo">
                <img src="images/wonderhills-logo.png" alt="Wonderhills College Logo" class="site-logo">
                <div>
                <h1><span>Wonderhills</span> College</h1>
                <div class="motto">"Raising Saintly Scholars"</div>
            </div>
            </div>
            <nav>
                <ul>
                    <li><a href="index.html">Home</a></li>
                    <li><a href="about.html">About</a></li>
                    <li><a href="staff.html">Staff</a></li>
                    <li><a href="news.html">News</a></li>
                    <li><a href="contact.html">Contact</a></li>
                    <li><a href="admission.html">Admission</a></li>
                    <li><a href="login.html" class="btn-login">Login</a></li>
                </ul>
            </nav>
        </div>
    </header>

    <main>
        <div class="container" style="max-width: 450px; margin: 3rem auto;">
            <div class="glass-card">
                <h2 style="text-align:center; color:#4a2c1a;">Reset Password</h2>
                <p style="text-align:center; color: #6b3a2a;">Enter your new password below.</p>

                <form id="resetPasswordForm" style="margin-top:1.5rem;">
                    <!-- New Password with Toggle -->
                    <div style="margin-bottom: 1rem;">
                        <label for="newPassword">New Password</label>
                        <div class="password-wrapper">
                            <input type="password" id="newPassword" placeholder="Min 6 characters" required>
                            <button type="button" class="toggle-password" onclick="togglePassword('newPassword', this)">👁️</button>
                        </div>
                    </div>

                    <!-- Confirm Password with Toggle -->
                    <div style="margin-bottom: 1.5rem;">
                        <label for="confirmPassword">Confirm Password</label>
                        <div class="password-wrapper">
                            <input type="password" id="confirmPassword" placeholder="Re-enter new password" required>
                            <button type="button" class="toggle-password" onclick="togglePassword('confirmPassword', this)">👁️</button>
                        </div>
                    </div>

                    <button type="submit" class="btn-primary" style="width:100%; border:none; cursor:pointer;">Reset Password</button>
                    <div id="resetMessage" style="margin-top:1rem; text-align:center; font-weight:bold;"></div>
                </form>

                <p style="margin-top:1rem; text-align:center;">
                    <a href="login.html" style="color:#1a3c5e;">Back to Login</a>
                </p>
            </div>
        </div>
    </main>

    <footer>
        <div class="container">
            <p>&copy; 2026 Wonderhills College. All rights reserved.</p>
        </div>
    </footer>

    <script src="js/main.js"></script>
    <script>
        // Toggle Password Visibility
        function togglePassword(inputId, button) {
            const input = document.getElementById(inputId);
            if (input.type === 'password') {
                input.type = 'text';
                button.textContent = '🙈';
            } else {
                input.type = 'password';
                button.textContent = '👁️';
            }
        }
    </script>
</body>
</html>
